resources:
  jobs:
    kyc_lakehouse_daily:
      name: kyc_lakehouse_daily
      tasks:
        - task_key: ingest_bronze
          disabled: false
          email_notifications: {}
          pipeline_task:
            pipeline_id: 82eaf1b0-19f3-4caf-9134-bbf849288725
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: transform_silver_gold
          depends_on:
            - task_key: ingest_bronze
          disabled: false
          email_notifications: {}
          max_retries: 1
          min_retry_interval_millis: 900000
          pipeline_task:
            pipeline_id: c4d425af-5a69-4a47-b690-75ff0a269c91
          retry_on_timeout: false
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: validate_gold
          depends_on:
            - task_key: transform_silver_gold
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: /Workspace/Users/talk2gracomot@gmail.com/kyc-lakehouse/src/jobs/validate_gold.sql
              source: WORKSPACE
            warehouse_id: 55d7393afe190294
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: validate_silver
          depends_on:
            - task_key: transform_silver_gold
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: /Workspace/Users/talk2gracomot@gmail.com/kyc-lakehouse/src/jobs/validate_silver.sql
              source: WORKSPACE
            warehouse_id: 55d7393afe190294
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: log_run_metrics
          depends_on:
            - task_key: validate_silver
            - task_key: validate_gold
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          sql_task:
            file:
              path: /Workspace/Users/talk2gracomot@gmail.com/kyc-lakehouse/src/monitoring/log_run_metrics.sql
              source: WORKSPACE
            warehouse_id: 55d7393afe190294
          timeout_seconds: 0
          webhook_notifications: {}
        - task_key: refresh_dashboard
          depends_on:
            - task_key: validate_silver
            - task_key: validate_gold
          dashboard_task:
            dashboard_id: 01f1da4e3d1012a9b99c373bb9cdbceb
            subscription:
              attachment:
                page_attachment: {}
            warehouse_id: 55d7393afe190294
          disabled: false
          email_notifications: {}
          run_if: ALL_SUCCESS
          timeout_seconds: 0
          webhook_notifications: {}
      email_notifications:
        no_alert_for_skipped_runs: false
        on_failure:
          - talk2gracomot@gmail.com
      max_concurrent_runs: 1
      notification_settings:
        no_alert_for_canceled_runs: false
        no_alert_for_skipped_runs: false
      performance_target: PERFORMANCE_OPTIMIZED
      queue:
        enabled: true
      timeout_seconds: 0
      webhook_notifications: {}
